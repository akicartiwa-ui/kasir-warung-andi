<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<title>Kasir Warung Andi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#166534;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.85;margin-top:4px}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px;position:sticky;top:69px;z-index:4;box-shadow:0 1px 5px #0001}
nav button{border:0;background:#e5e7eb;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:bold}
nav button.active{background:#166534;color:#fff}
main{padding:12px;max-width:900px;margin:auto}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border-radius:12px;background:#f0fdf4}
.stat b{display:block;font-size:19px;margin-top:4px}.muted{color:#6b7280;font-size:12px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 9px;font-size:15px}
button{cursor:pointer}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}.primary{background:#166534;color:#fff}.danger{background:#dc2626;color:#fff}.warn{background:#f59e0b;color:#111}.gray{background:#e5e7eb}
.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}
.total{font-size:20px;font-weight:bold;text-align:right;margin:12px 0}.empty{text-align:center;color:#6b7280;padding:25px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.qty{display:flex;gap:5px;align-items:center}.qty button{width:32px;height:32px;border:0;border-radius:7px;background:#e5e7eb;font-weight:bold}
.badge{padding:3px 7px;border-radius:20px;background:#dcfce7;color:#166534;font-size:11px}.low{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header><h1>Kasir Warung Andi</h1><div class="sub">Kasir • Stok • Penjualan • Keuntungan</div></header>
<nav>
<button class="active" onclick="show('kasir',this)">Kasir</button>
<button onclick="show('barang',this)">Barang & Stok</button>
<button onclick="show('riwayat',this)">Riwayat</button>
<button onclick="show('laporan',this)">Laporan</button>
<button onclick="show('pengaturan',this)">Pengaturan</button>
</nav>
<main>
<section id="kasir" class="page active">
<div class="card"><div class="row"><input id="cari" placeholder="Cari nama / barcode..." oninput="renderKasir()"><button class="btn gray" onclick="mulaiScan('cari')">📷 Scan</button></div><div id="daftarKasir"></div><div class="total">Total: <span id="total">Rp0</span></div><div class="row"><button class="btn gray" onclick="kosongkanKeranjang()">Kosongkan</button><button class="btn primary" onclick="bayar()">Bayar</button></div></div>
</section>

<section id="barang" class="page">
<div class="card">
<h3>Tambah / Edit Barang</h3>
<input type="hidden" id="editId">
<label>Barcode</label><div class="row"><input id="barcode" placeholder="Contoh: 8991234567890" inputmode="numeric"><button type="button" class="btn gray" onclick="mulaiScan('barcode')">📷 Scan</button></div><label>Nama barang</label><input id="nama" placeholder="Contoh: Indomie Goreng">
<label>Harga beli</label><input id="beli" type="number" min="0" placeholder="0">
<label>Harga jual</label><input id="jual" type="number" min="0" placeholder="0">
<label>Stok</label><input id="stok" type="number" min="0" placeholder="0">
<div class="row"><button class="btn primary" onclick="simpanBarang()">Simpan Barang</button><button class="btn gray" onclick="resetForm()">Batal</button></div>
</div>
<div class="card"><input id="cariBarang" placeholder="Cari nama barang..." oninput="renderBarang()"><div id="tabelBarang"></div></div>
</section>

<section id="riwayat" class="page"><div class="card"><h3>Riwayat Penjualan</h3><div id="riwayatList"></div></div></section>

<section id="laporan" class="page"><div class="grid">
<div class="stat">Omzet<b id="omzet">Rp0</b></div>
<div class="stat">Keuntungan<b id="untung">Rp0</b></div>
<div class="stat">Transaksi<b id="jumlahTrans">0</b></div>
<div class="stat">Nilai Stok<b id="nilaiStok">Rp0</b></div>
</div><div class="card"><h3>Ringkasan</h3><div id="ringkasan"></div></div></section>

<section id="pengaturan" class="page">
<div class="card"><h3>Data Aplikasi</h3>
<p class="muted">Data tersimpan di browser/perangkat ini.</p>
<div class="row"><button class="btn gray" onclick="exportData()">Backup Data</button><button class="btn primary" onclick="document.getElementById('file').click()">Pulihkan</button></div>
<input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)">
<hr><button class="btn danger" onclick="hapusSemua()">Hapus Semua Data</button>
</div></section>
</main>
<script>
const key='kasirWarungAndiV2';
let db=JSON.parse(localStorage.getItem(key)||'null')||{barang:[
{id:1,barcode:'8991234567890',nama:'Indomie Goreng',beli:2500,jual:3500,stok:10},
{id:2,barcode:'8991234567891',nama:'Aqua 600ml',beli:2500,jual:3500,stok:10},
{id:3,barcode:'8991234567892',nama:'Teh Pucuk',beli:3000,jual:4000,stok:10}
],transaksi:[]};
let keranjang={};db.barang.forEach(x=>{if(x.barcode==null)x.barcode=''});save();
function save(){localStorage.setItem(key,JSON.stringify(db))}
function rp(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='kasir')renderKasir();if(id==='barang')renderBarang();if(id==='riwayat')renderRiwayat();if(id==='laporan')renderLaporan()}
function renderKasir(){
 let q=(document.getElementById('cari').value||'').trim().toLowerCase(), a=db.barang.filter(x=>x.nama.toLowerCase().includes(q)||(x.barcode||'').toLowerCase().includes(q));
 document.getElementById('daftarKasir').innerHTML=a.length?a.map(x=>`<div class="item"><div><b>${x.nama}</b><br><span class="muted">${rp(x.jual)} • Stok ${x.stok}</span></div><div class="qty"><button onclick="ubahKeranjang(${x.id},-1)">−</button><b>${keranjang[x.id]||0}</b><button onclick="ubahKeranjang(${x.id},1)">+</button></div></div>`).join(''):'<div class="empty">Barang tidak ditemukan</div>';
 let total=Object.entries(keranjang).reduce((s,[id,q])=>s+(db.barang.find(x=>x.id==id)?.jual||0)*q,0);document.getElementById('total').textContent=rp(total)
}
function ubahKeranjang(id,d){let b=db.barang.find(x=>x.id===id);let n=(keranjang[id]||0)+d;if(n<0)n=0;if(n>b.stok)n=b.stok;if(n===0)delete keranjang[id];else keranjang[id]=n;renderKasir()}
function kosongkanKeranjang(){keranjang={};renderKasir()}
function bayar(){let items=Object.entries(keranjang).map(([id,q])=>{let b=db.barang.find(x=>x.id==id);return b?{id:b.id,nama:b.nama,qty:q,harga:b.jual,beli:b.beli}:null}).filter(Boolean);if(!items.length)return alert('Keranjang masih kosong');let total=items.reduce((s,x)=>s+x.harga*x.qty,0),untung=items.reduce((s,x)=>s+(x.harga-x.beli)*x.qty,0);if(!confirm('Total '+rp(total)+'\\nSimpan transaksi?'))return;items.forEach(x=>{let b=db.barang.find(y=>y.id===x.id);b.stok-=x.qty});db.transaksi.unshift({id:Date.now(),waktu:new Date().toISOString(),items,total,untung});save();keranjang={};renderKasir();alert('Transaksi tersimpan')}
function resetForm(){['editId','barcode','nama','beli','jual','stok'].forEach(id=>document.getElementById(id).value='')}
function simpanBarang(){let id=document.getElementById('editId').value,bc=document.getElementById('barcode').value.trim(),n=document.getElementById('nama').value.trim(),b=+document.getElementById('beli').value,j=+document.getElementById('jual').value,s=+document.getElementById('stok').value;if(!n)return alert('Nama barang wajib diisi');if(b<0||j<0||s<0)return alert('Angka tidak boleh negatif');if(id){let x=db.barang.find(y=>y.id==id);Object.assign(x,{barcode:bc,nama:n,beli:b,jual:j,stok:s})}else db.barang.push({id:Date.now(),barcode:bc,nama:n,beli:b,jual:j,stok:s});save();resetForm();renderBarang();alert('Barang tersimpan')}
function editBarang(id){let x=db.barang.find(y=>y.id===id);document.getElementById('editId').value=x.id;document.getElementById('barcode').value=x.barcode||'';document.getElementById('nama').value=x.nama;document.getElementById('beli').value=x.beli;document.getElementById('jual').value=x.jual;document.getElementById('stok').value=x.stok;scrollTo(0,0)}
function tambahStok(id,d){let x=db.barang.find(y=>y.id===id);x.stok=Math.max(0,x.stok+d);save();renderBarang()}
function hapusBarang(id){if(confirm('Hapus barang ini?')){db.barang=db.barang.filter(x=>x.id!==id);delete keranjang[id];save();renderBarang()}}
function renderBarang(){let q=(document.getElementById('cariBarang').value||'').toLowerCase(),a=db.barang.filter(x=>x.nama.toLowerCase().includes(q));document.getElementById('tabelBarang').innerHTML='<div class="tablewrap"><table><tr><th>Barcode</th><th>Barang</th><th>Beli</th><th>Jual</th><th>Stok</th><th>Aksi</th></tr>'+a.map(x=>`<tr><td>${x.barcode||'-'}</td><td><b>${x.nama}</b></td><td>${rp(x.beli)}</td><td>${rp(x.jual)}</td><td><span class="badge ${x.stok<=3?'low':''}">${x.stok}</span></td><td><button class="btn gray" onclick="tambahStok(${x.id},1)">+1</button> <button class="btn gray" onclick="editBarang(${x.id})">Edit</button> <button class="btn danger" onclick="hapusBarang(${x.id})">Hapus</button></td></tr>`).join('')+'</table></div>'}
function renderRiwayat(){document.getElementById('riwayatList').innerHTML=db.transaksi.length?db.transaksi.map(t=>`<div class="item"><div><b>${new Date(t.waktu).toLocaleString('id-ID')}</b><br><span class="muted">${t.items.map(x=>x.nama+' × '+x.qty).join(', ')}</span></div><b>${rp(t.total)}</b></div>`).join(''):'<div class="empty">Belum ada transaksi</div>'}
function renderLaporan(){let o=db.transaksi.reduce((s,t)=>s+t.total,0),u=db.transaksi.reduce((s,t)=>s+t.untung,0),n=db.barang.reduce((s,x)=>s+x.beli*x.stok,0);document.getElementById('omzet').textContent=rp(o);document.getElementById('untung').textContent=rp(u);document.getElementById('jumlahTrans').textContent=db.transaksi.length;document.getElementById('nilaiStok').textContent=rp(n);document.getElementById('ringkasan').innerHTML=`Total barang: <b>${db.barang.length}</b><br>Total stok: <b>${db.barang.reduce((s,x)=>s+x.stok,0)}</b>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-kasir-warung-andi.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.barang||!x.transaksi)throw 0;db=x;save();location.reload()}catch(_){alert('File backup tidak valid')}};r.readAsText(f)}
function hapusSemua(){if(confirm('Hapus SEMUA barang dan riwayat transaksi?')){db={barang:[],transaksi:[]};keranjang={};save();location.reload()}}

let scanTarget=null,scanStream=null,scanTimer=null,scanBusy=false;
async function mulaiScan(target){
  scanTarget=target;
  const box=document.getElementById('scanBox'),video=document.getElementById('scannerVideo'),status=document.getElementById('scanStatus');
  box.style.display='block';
  status.textContent='Meminta izin kamera...';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    status.textContent='Kamera langsung tidak tersedia. Buka aplikasi melalui HTTPS atau browser yang mendukung kamera.';
    return;
  }
  if(!('BarcodeDetector' in window)){
    status.textContent='Browser ini belum mendukung scanner barcode otomatis. Coba Chrome terbaru.';
    return;
  }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=scanStream;
    await video.play();
    const formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];
    let detector;
    try{detector=new BarcodeDetector({formats});}
    catch(e){detector=new BarcodeDetector();}
    scanBusy=false;
    scanTimer=setInterval(async()=>{
      if(scanBusy||video.readyState<2)return;
      scanBusy=true;
      try{
        const codes=await detector.detect(video);
        if(codes&&codes.length&&codes[0].rawValue){
          prosesBarcode(codes[0].rawValue);
          hentikanScan();
        }
      }catch(e){}
      scanBusy=false;
    },150);
    status.textContent='Arahkan barcode ke kotak kamera. Akan masuk otomatis.';
  }catch(e){
    status.textContent='Kamera ditolak/tidak tersedia. Izinkan akses kamera untuk aplikasi/browser ini.';
  }
}
function prosesBarcode(code){
  code=String(code).trim();
  if(scanTarget==='barcode'){
    document.getElementById('barcode').value=code;
    const x=db.barang.find(y=>String(y.barcode||'')===code);
    if(x){
      editBarang(x.id);
      document.getElementById('barcode').value=code;
      alert('Barcode sudah terdaftar pada '+x.nama);
    }
  }else{
    const x=db.barang.find(y=>String(y.barcode||'')===code);
    if(x){
      const jumlah=keranjang[x.id]||0;
      if(jumlah<x.stok) ubahKeranjang(x.id,1);
      else alert('Stok '+x.nama+' sudah habis.');
    }else{
      document.getElementById('cari').value=code;
      renderKasir();
      alert('Barcode '+code+' belum terdaftar. Tambahkan barang di menu Barang & Stok.');
    }
  }
}
function hentikanScan(){
  if(scanTimer){clearInterval(scanTimer);scanTimer=null}
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  const v=document.getElementById('scannerVideo');
  if(v)v.srcObject=null;
  const box=document.getElementById('scanBox');
  if(box)box.style.display='none';
  scanBusy=false;
}

renderKasir();
</script>

<div id="scanBox" style="display:none;position:fixed;inset:0;background:#000c;z-index:20;padding:15px">
  <div style="background:#fff;border-radius:14px;padding:12px;max-width:520px;margin:10px auto">
    <h3 style="margin:4px 0 10px">📷 Scan Barcode</h3>
    <video id="scannerVideo" autoplay playsinline muted style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#111"></video>
    <div id="scanStatus" class="muted" style="padding:10px 0">Arahkan barcode ke kamera...</div>
    <button class="btn danger" onclick="hentikanScan()">Tutup</button>
  </div>
</div>
</body></html>
